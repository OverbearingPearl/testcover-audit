# For this repository itself: its own commits are checked by its own checker.
# A project that vendors this directory gets its own configuration from
# ci/bootstrap.sh and ignores this one.
minimum_pre_commit_version: '3.0.0'
repos:
  - repo: local
    hooks:
      - id: commit-message
        name: commit message shape
        entry: ./check-commit-message.sh
        language: system
        stages: [commit-msg]
